 <app-header></app-header>

 <main class="products-grid-container">
  <div class="products-grid">
    @for(item of item; track item.id) {
      <div class="product-card" (click)="viewProduct(item.id)">
        <img [src]="item.avatar" [alt]="item.name" class="product-image">
        <h3 class="product-name">{{item.name}}</h3>
        <p class="product-price">{{item.price | currency:'BRL'}}</p>
        <button class="buy-button" (click)="addToCart(item); $event.stopPropagation()">
          Comprar
        </button>
      </div>
    } @empty {
      <p class="no-items">Nenhum item encontrado</p>
    }
  </div>
</main>

<app-footer></app-footer>
